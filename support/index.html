<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Keeply</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <script src="../assets/tailwind.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #111, #666);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-200 relative">

    <!-- Navbar -->
    <nav class="w-full p-6 sm:p-8 flex items-center justify-center sm:justify-start z-50 animate-fade-in-up lg:absolute lg:top-0 lg:left-0 lg:px-10">
        <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <img src="../assets/logo_black.svg" alt="keeply Logo" class="h-8 w-auto">
            <span class="text-xl tracking-tight">Keeply</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center max-w-7xl mx-auto w-full px-6 sm:px-12 py-8 lg:py-0 gap-10 sm:gap-12 lg:gap-24">

        <!-- Left Side: Text and Form -->
        <div class="flex-1 text-center lg:text-left space-y-6 lg:space-y-8 w-full">
            <div class="space-y-4 lg:space-y-6">
                <h1 class="text-[2.25rem] leading-[1.15] sm:text-5xl lg:text-6xl xl:text-7xl font-extrabold tracking-tight gradient-text animate-fade-in-up delay-100">
                    Wir sind für<wbr> dich da.
                </h1>
                <p class="text-[1.05rem] sm:text-lg lg:text-xl xl:text-2xl text-gray-600 max-w-2xl mx-auto lg:mx-0 leading-relaxed animate-fade-in-up delay-200">
                    Brauchst du Unterstützung bei der Keeply App oder hast du Fragen? Schreib uns einfach eine E-Mail an hello@getkeepit.app und wir helfen dir so schnell wie möglich weiter.
                </p>
            </div>

            <div class="max-w-md mx-auto lg:mx-0 animate-fade-in-up delay-300 pt-4">
                <a href="mailto:hello@getkeepit.app" class="inline-block w-full sm:w-auto px-8 py-4 rounded-xl bg-[#608aad] text-white font-semibold hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 transition-all text-center">
                    Nachricht schreiben
                </a>
            </div>
        </div>

        <!-- Right Side: App Mockup -->
        <div class="flex-1 flex justify-center lg:justify-end w-full animate-fade-in-up delay-500 pb-8 lg:py-0">
            <div class="relative w-[75%] max-w-[260px] sm:max-w-[280px] lg:max-w-[300px] xl:max-w-[320px] aspect-[9/19.5] bg-white border-[8px] lg:border-[10px] border-black rounded-[2.8rem] lg:rounded-[3.2rem] shadow-2xl flex flex-col items-center justify-center overflow-hidden transform lg:-rotate-2 hover:rotate-0 transition-transform duration-500">
                <!-- App Content / Image without cropping, just precisely positioned -->
                <div class="absolute inset-0 w-full h-full">
                    <img src="../assets/mock.png" alt="Keeply App Preview" class="w-full h-full object-fill object-top absolute inset-0">
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 px-4 flex flex-wrap justify-center gap-x-6 gap-y-3 text-xs lg:text-sm text-gray-400 animate-fade-in-up delay-500 mt-auto lg:absolute lg:bottom-0">
        <a href="https://getkeepit.app/impressum/" class="hover:text-gray-800 transition-colors">Impressum</a>
        <a href="https://getkeepit.app/datenschutz/" class="hover:text-gray-800 transition-colors">Datenschutz</a>
        <a href="https://getkeepit.app/nutzungsbedingungen/" class="hover:text-gray-800 transition-colors">Nutzungsbedingungen</a>
    </footer>

</body>
</html>
